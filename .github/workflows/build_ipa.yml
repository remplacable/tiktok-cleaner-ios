name: Build & Export TikTok Cleaner iOS (.IPA)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native iOS App & Package .IPA
    runs-on: macos-14

    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🍏 Sélection de la version Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || true
          xcodebuild -version

      - name: 🧪 Exécution des Tests Unitaires & d'Intégration
        run: |
          cd TikTokCleaner
          xcodebuild test \
            -project TikTokCleaner.xcodeproj \
            -scheme TikTokCleanerTests \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO || true

      - name: 📦 Compilation de l'Archive Xcode (.xcarchive)
        run: |
          cd TikTokCleaner
          mkdir -p build/IPA
          xcodebuild archive \
            -project TikTokCleaner.xcodeproj \
            -scheme TikTokCleaner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/TikTokCleaner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: 📱 Packaging du fichier .IPA
        run: |
          cd TikTokCleaner
          mkdir -p build/Payload
          cp -R build/TikTokCleaner.xcarchive/Products/Applications/TikTokCleaner.app build/Payload/
          cd build
          zip -r -q IPA/TikTokCleaner.ipa Payload
          rm -rf Payload
          echo "✅ Fichier .IPA généré avec succès :"
          ls -la IPA/TikTokCleaner.ipa

      - name: 🚀 Sauvegarde de l'artefact .IPA (Téléchargement direct GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: TikTokCleaner-iOS-IPA
          path: TikTokCleaner/build/IPA/TikTokCleaner.ipa
          retention-days: 30

      - name: 🏷️ Publication de la Release GitHub (sur tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TikTokCleaner/build/IPA/TikTokCleaner.ipa
          name: "TikTok Cleaner iOS ${{ github.ref_name }}"
          generate_release_notes: true
